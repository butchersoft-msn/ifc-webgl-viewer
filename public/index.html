<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFC WebGL Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="video" autoplay muted playsinline aria-label="Remote model view"></video>
  
  <div id="hud" class="hud">
    <div class="stats">
      <form id="login">
        <label for="password">Viewer password (if configured)</label>
        <input id="password" type="password" autocomplete="current-password">
        <button type="submit">Start viewing</button>
      </form>
    </div>
    
    <div class="controls">
      <h3>Controls</h3>
      <p><strong>Movement:</strong> Arrow Keys or WASD</p>
      <p><strong>Look:</strong> Click video, then move mouse</p>
      <p><strong>Exit Look:</strong> Press ESC</p>
    </div>
    
    <div class="status">
      <div id="connectionStatus" class="status-disconnected">● Disconnected</div>
    </div>
  </div>
  
  <script src="client.js"></script>
</body>
</html>
